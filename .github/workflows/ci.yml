name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Observatory
        run: python -m pip install --editable .

      - name: Run contract and query tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

      - name: Verify checked-in fixture snapshots
        run: |
          python scripts/verify_fixtures.py
          python scripts/verify_health_fixtures.py

      - name: Smoke-test the CLI
        run: |
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "${temporary_directory}"' EXIT
          observatory-intelligence build \
            --input fixtures/repository-intelligence/relay-complete-quest.input.json \
            --input fixtures/repository-intelligence/observatory-active.input.json \
            --output "${temporary_directory}"
          observatory-intelligence query \
            --snapshot "${temporary_directory}/repositories/egohygiene--relay.json" \
            --view now \
            --output "${temporary_directory}/now.json"
          observatory-intelligence compare \
            --before fixtures/expected/egohygiene--relay.repository.json \
            --after "${temporary_directory}/repositories/egohygiene--relay.json" \
            --output "${temporary_directory}/compare.json"
          observatory-health adapt-egolint \
            --report fixtures/health/egolint.report.v1.input.json \
            --repository egohygiene/empathy \
            --represented-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --valid-until 2027-01-01T00:00:00Z \
            --source-url https://example.com/egolint-report.json \
            --producer-version 0.1.0-alpha.1 \
            --output "${temporary_directory}/egolint-evidence.json"
          observatory-health build \
            --catalog fixtures/health/hygiene.repositories.v1.input.yaml \
            --catalog-url https://github.com/egohygiene/hygiene/blob/28f9d6c7519d820644572634ba4476614f418d83/catalog/repositories.yaml \
            --catalog-commit 28f9d6c7519d820644572634ba4476614f418d83 \
            --evidence fixtures/health/observatory.repository-evidence.input.json \
            --as-of 2026-09-02T12:00:00Z \
            --output "${temporary_directory}/organization-health"
